[project]
name = "dev-assistant"
version = "0.1.0"
description = "Turns a code snippet into structured documentation, explanations, and refactoring suggestions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
explain = "dev_assistant.interface.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dev_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
